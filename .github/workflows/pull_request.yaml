name: pull request
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mainnet
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize database
        run: |
          for file in $GITHUB_WORKSPACE/database/*.sql; do
            psql -h localhost -U postgres -d mainnet -f "$file"
          done
        env:
          PGPASSWORD: postgres
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Requirements
        run:
          pip install -r requirements.txt
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=src" >> $GITHUB_ENV
      - name: Pylint
        run:
          pylint --fail-under=8 $(git ls-files '**/*.py')
      - name: Black
        run:
          black --check ./
      - name: Type Check (mypy)
        run: mypy src
      - name: Tests
        run: pytest tests/unit/ tests/e2e/
        env:
          NODE_URL: ${{ secrets.NODE_URL }}
          SOLVER_SLIPPAGE_DB_URL: postgres:postgres@localhost:5432/mainnet
          CHAIN_SLEEP_TIME: 1
